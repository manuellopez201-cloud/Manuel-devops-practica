<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda Online</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Gestión de Tienda Online</h1>
    
    <div class="card">
        <label>URL API Base:</label>
        <input type="text" id="apiUrl" value="http://localhost:8000">
    </div>

    <div class="grid">
        <div class="card">
            <h2>Productos</h2>
            <button onclick="cargarProductos()">Cargar Productos</button>
            <ul id="listaProductos"></ul>

            <h3>Nuevo Producto</h3>
            <form onsubmit="crearProducto(event)">
                <input type="text" id="pNombre" placeholder="Nombre" required>
                <input type="number" step="0.01" id="pPrecio" placeholder="Precio" required>
                <input type="number" id="pStock" placeholder="Stock" required>
                <select id="pTipo">
                    <option value="generico">Genérico</option>
                    <option value="electronico">Electrónico</option>
                    <option value="ropa">Ropa</option>
                </select>
                <button type="submit">Guardar Producto</button>
            </form>
        </div>

        <div class="card">
            <h2>Usuarios</h2>
            <button onclick="cargarUsuarios()">Cargar Usuarios</button>
            <ul id="listaUsuarios"></ul>
        </div>

        <div class="card">
            <h2>Pedidos</h2>
            <h3>Crear Pedido</h3>
            <form onsubmit="crearPedido(event)">
                <input type="number" id="pedCliente" placeholder="ID Cliente" required>
                <input type="number" id="pedProd" placeholder="ID Producto" required>
                <input type="number" id="pedCant" placeholder="Cantidad" required>
                <button type="submit">Realizar Pedido</button>
            </form>

            <h3>Buscar Pedidos</h3>
            <input type="number" id="buscarCliente" placeholder="ID Cliente">
            <button onclick="cargarPedidos()">Buscar</button>
            <ul id="listaPedidos"></ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
